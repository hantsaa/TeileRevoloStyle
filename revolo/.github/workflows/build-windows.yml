name: Build VST3 (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item -Recurse build/RevoloStyle_artefacts/Release/VST3/RevoloStyle.vst3 dist/
          Copy-Item build/RevoloStyle_artefacts/Release/Standalone/*.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item install.bat dist/
      - uses: actions/upload-artifact@v4
        with:
          name: RevoloStyle-Windows
          path: dist
